name: 테스트

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    # 리눅스에서는 가짜 윈도우로, 윈도우에서는 진짜 윈도우 위에서 돈다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q
